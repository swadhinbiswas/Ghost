<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%">

  <!-- Background -->
  <rect width="1200" height="140" fill="#0b0b10"/>

  <defs>
    <!-- GRID -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#111118"/>
      <path d="M20 0H0V20" stroke="#1a1a26" stroke-width="1"/>
    </pattern>

    <!-- SCANLINES -->
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#ffffff08"/>
    </pattern>

    <!-- STRIPES -->
    <pattern id="stripes" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 6 L6 0" stroke="#ffffff22" stroke-width="1"/>
    </pattern>

    <!-- STRONG GLOW -->
    <filter id="neon">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- TOP GRID -->
  <rect width="1200" height="40" fill="url(#grid)" />

  <!-- ⚡ CRAZY GLITCH BAR -->
  <g>
    <rect x="200" y="18" width="800" height="6" fill="#1a1a26"/>

    <!-- RGB layers -->
    <rect x="200" y="18" width="620" height="6" fill="#ff4ecd" opacity="0.6">
      <animate attributeName="x" values="200;198;202;200" dur="0.2s" repeatCount="indefinite"/>
    </rect>

    <rect x="200" y="18" width="620" height="6" fill="#4ef0ff" opacity="0.6">
      <animate attributeName="x" values="200;202;198;200" dur="0.2s" repeatCount="indefinite"/>
    </rect>

    <rect x="200" y="18" width="620" height="6" fill="#bb9af7">
      <animate attributeName="width"
               values="600;660;620;640;620"
               dur="1.2s"
               repeatCount="indefinite"/>
    </rect>

    <rect x="200" y="18" width="800" height="6"
          fill="url(#stripes)" opacity="0.4"/>
  </g>

  <!-- 👻 ULTRA GHOST -->
  <g filter="url(#neon)">
    <g id="ghost" transform="translate(70,70) scale(1.3)">

      <!-- FLOAT + WOBBLE -->
      <animateTransform attributeName="transform"
                        type="translate"
                        values="70,70; 70,60; 70,70"
                        dur="2.5s"
                        repeatCount="indefinite"/>

      <animateTransform attributeName="transform"
                        additive="sum"
                        type="rotate"
                        values="0 40 40; 2 40 40; -2 40 40; 0 40 40"
                        dur="3s"
                        repeatCount="indefinite"/>

      <!-- BODY -->
      <path d="
        M20 20 H60 V60
        H55 V70 H50 V60
        H45 V70 H40 V60
        H35 V70 H30 V60
        H25 V70 H20 Z"
        fill="#bb9af7">

        <!-- GLOW PULSE -->
        <animate attributeName="opacity"
                 values="0.8;1;0.85;1"
                 dur="1.5s"
                 repeatCount="indefinite"/>
      </path>

      <!-- EYES -->
      <rect x="28" y="32" width="6" height="8" fill="#0b0b10"/>
      <rect x="46" y="32" width="6" height="8" fill="#0b0b10"/>

      <!-- RGB GLITCH EYES -->
      <rect x="27" y="32" width="6" height="8" fill="#ff4ecd" opacity="0.4"/>
      <rect x="47" y="32" width="6" height="8" fill="#4ef0ff" opacity="0.4"/>

      <!-- SHINE -->
      <rect x="30" y="33" width="2" height="2" fill="#fff"/>
      <rect x="48" y="33" width="2" height="2" fill="#fff"/>

      <!-- SPOOKY MOUTH -->
      <rect x="38" y="45" width="4" height="4" fill="#0b0b10"/>

    </g>
  </g>

  <!-- 🎮 TEXT WITH RGB GLITCH -->
  <g font-family="monospace" font-size="56" font-weight="bold">

    <text x="150" y="110" fill="#ff4ecd" opacity="0.6">GHOST</text>
    <text x="154" y="110" fill="#4ef0ff" opacity="0.6">GHOST</text>

    <text x="150" y="110" fill="#bb9af7">
      GHOST
      <animate attributeName="opacity"
               values="1;0.7;1;0.9;1"
               dur="1.2s"
               repeatCount="indefinite"/>
    </text>

  </g>

  <!-- 📺 SCANLINE OVERLAY -->
  <rect width="1200" height="140" fill="url(#scan)" opacity="0.15"/>

  <!-- BOTTOM BAR -->
  <rect x="0" y="135" width="1200" height="5" fill="#bb9af7"/>

</svg>