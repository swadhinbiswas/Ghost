<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" shape-rendering="crispEdges">

  <!-- 👻 Ghost Body (refined symmetry) -->
  <path fill="#bb9af7" d="
    M60 20 H140
    V40 H160
    V60 H180
    V120 H160
    V140 H140
    V160 H120
    V180 H100
    V160 H80
    V180 H60
    V160 H40
    V140 H20
    V120 H0
    V60 H20
    V40 H40
    V20 H60
    Z
  "/>

  <!-- 🌫️ Subtle shading (adds depth) -->
  <path fill="#9f7aea" d="
    M40 120 H160
    V140 H140
    V160 H120
    V140 H100
    V160 H80
    V140 H60
    V160 H40
    Z
  " opacity="0.35"/>

  <!-- 👀 Eyes (centered & cleaner) -->
  <rect x="72" y="78" width="12" height="22" fill="#0b0b10"/>
  <rect x="116" y="78" width="12" height="22" fill="#0b0b10"/>

  <!-- ✨ Eye highlights -->
  <rect x="74" y="80" width="4" height="6" fill="#ffffff"/>
  <rect x="118" y="80" width="4" height="6" fill="#ffffff"/>

  <!-- 😊 Mouth (cuter + centered) -->
  <rect x="90" y="112" width="20" height="10" fill="#0b0b10"/>

  <!-- 👅 Tiny tongue -->
  <rect x="95" y="116" width="10" height="6" fill="#ff6b9a"/>

  <!-- 💖 Blush (better placement) -->
  <rect x="58" y="104" width="12" height="10" fill="#ff4d88" opacity="0.8"/>
  <rect x="130" y="104" width="12" height="10" fill="#ff4d88" opacity="0.8"/>

</svg>