<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none" role="img" aria-label="Ghost — a beautiful, free AI assistant for your terminal">
  <title>Ghost CLI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15131f"/>
      <stop offset="0.45" stop-color="#100e1a"/>
      <stop offset="1" stop-color="#0a0910"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.18" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#bd93f9" stop-opacity="0.45"/>
      <stop offset="0.5" stop-color="#bd93f9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowK" cx="0.88" cy="0.82" r="0.65">
      <stop offset="0" stop-color="#ff79c6" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ff79c6" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#ff79c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f0e6ff"/>
      <stop offset="0.35" stop-color="#d0b9ff"/>
      <stop offset="0.7" stop-color="#ff79c6"/>
      <stop offset="1" stop-color="#ffb86c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#f3edff"/>
      <stop offset="0.8" stop-color="#d4befa"/>
      <stop offset="1" stop-color="#b896f0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bd93f9" stop-opacity="0.55"/>
      <stop offset="0.4" stop-color="#ff79c6" stop-opacity="0.2"/>
      <stop offset="0.8" stop-color="#bd93f9" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="softSmall" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <style>
      @keyframes float { 0%,100%{ transform: translateY(0) rotate(-1deg);} 50%{ transform: translateY(-16px) rotate(1deg);} }
      @keyframes pulse { 0%,100%{ opacity:.45; transform: scale(1);} 50%{ opacity:.9; transform: scale(1.06);} }
      @keyframes blink { 0%,90%,100%{ transform: scaleY(1);} 95%{ transform: scaleY(.12);} }
      @keyframes tw { 0%,100%{ opacity:.2;} 50%{ opacity:.9;} }
      @keyframes dash { to { stroke-dashoffset: 0; } }
      @keyframes fadeUp { 0%{ opacity:0; transform: translateY(8px);} 100%{ opacity:1; transform: translateY(0);} }
      .ghost { transform-box: fill-box; transform-origin: center; animation: float 5s ease-in-out infinite; }
      .aura  { transform-box: fill-box; transform-origin: center; animation: pulse 4.5s ease-in-out infinite; }
      .eyes  { transform-box: fill-box; transform-origin: center; animation: blink 7s infinite; }
      .s1 { animation: tw 3s ease-in-out infinite; }
      .s2 { animation: tw 2.6s ease-in-out infinite .5s; }
      .s3 { animation: tw 3.6s ease-in-out infinite 1s; }
      .s4 { animation: tw 2.4s ease-in-out infinite .8s; }
      .s5 { animation: tw 3.2s ease-in-out infinite .3s; }
      .underline { stroke-dasharray: 540; stroke-dashoffset: 540; animation: dash 1.8s ease-out .4s forwards; }
      .tagline { animation: fadeUp .8s ease-out .6s both; }
      .pills { animation: fadeUp .8s ease-out 1s both; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glowP)"/>
  <rect width="1200" height="380" rx="24" fill="url(#glowK)"/>
  <rect x="0.5" y="0.5" width="1199" height="379" rx="23.5" fill="none" stroke="#bd93f9" stroke-opacity="0.14" stroke-width="1"/>

  <!-- twinkle stars -->
  <g fill="#f8f8f2">
    <circle class="s1" cx="540" cy="55" r="2"/>
    <circle class="s2" cx="990" cy="50" r="1.8"/>
    <circle class="s3" cx="1120" cy="130" r="2.2"/>
    <circle class="s4" cx="720" cy="310" r="1.6"/>
    <circle class="s2" cx="1060" cy="290" r="1.8"/>
    <circle class="s1" cx="490" cy="260" r="1.5"/>
    <circle class="s5" cx="880" cy="80" r="1.4"/>
    <circle class="s3" cx="1140" cy="250" r="1.7"/>
    <circle class="s4" cx="390" cy="100" r="1.6"/>
  </g>

  <!-- ghost mascot -->
  <g transform="translate(165 195)">
    <ellipse class="aura" cx="0" cy="0" rx="140" ry="140" fill="url(#aura)" filter="url(#soft)"/>
    <g class="ghost">
      <!-- cute arms -->
      <ellipse cx="-68" cy="24" rx="13" ry="19" transform="rotate(22 -68 24)" fill="url(#skin)"/>
      <ellipse cx="68" cy="24" rx="13" ry="19" transform="rotate(-22 68 24)" fill="url(#skin)"/>
      <!-- main body with scalloped hem -->
      <path d="M-72 4 Q-72 -88 0 -88 Q72 -88 72 4 L72 76
               Q72 93 58 93 Q44 93 40 81 Q36 93 24 93 Q12 93 8 81
               Q4 93 -8 93 Q-20 93 -24 81 Q-28 93 -40 93 Q-52 93 -58 81
               Q-64 93 -72 93 Q-80 93 -72 76 Z" fill="url(#skin)"/>
      <!-- soft body highlight -->
      <path d="M-2 -84 Q24 -84 48 -28 Q56 0 56 40 Q56 76 42 88 Q28 93 16 81 Q8 93 0 85 Q-8 93 -16 81 Q-28 93 -42 88 Q-56 76 -56 40 Q-56 0 -48 -28 Q-24 -84 -2 -84 Z" fill="#ffffff" fill-opacity="0.2"/>
      <!-- rosy cheeks -->
      <ellipse cx="-36" cy="16" rx="16" ry="10" fill="#ff8ed0" fill-opacity="0.75" filter="url(#softSmall)"/>
      <ellipse cx="36" cy="16" rx="16" ry="10" fill="#ff8ed0" fill-opacity="0.75" filter="url(#softSmall)"/>
      <!-- big sparkly eyes -->
      <g class="eyes">
        <ellipse cx="-28" cy="-10" rx="15" ry="20" fill="#16121f"/>
        <ellipse cx="28" cy="-10" rx="15" ry="20" fill="#16121f"/>
        <!-- main eye shine -->
        <circle cx="-23" cy="-18" r="6" fill="#ffffff"/>
        <circle cx="33" cy="-18" r="6" fill="#ffffff"/>
        <!-- secondary sparkle -->
        <circle cx="-33" cy="-4" r="2.8" fill="#ffffff" fill-opacity="0.8"/>
        <circle cx="23" cy="-4" r="2.8" fill="#ffffff" fill-opacity="0.8"/>
      </g>
      <!-- happy smile -->
      <path d="M-10 22 Q0 34 10 22 Q0 28 -10 22 Z" fill="#16121f"/>
      <!-- tiny tongue -->
      <path d="M-4 24 Q0 31 4 24 Z" fill="#ff8ed0" fill-opacity="0.6"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif">
    <text x="350" y="178" font-size="122" font-weight="800" letter-spacing="-3.5" fill="url(#word)">Ghost</text>
    <path class="underline" d="M354 208 H878" stroke="url(#word)" stroke-width="5.5" stroke-linecap="round"/>
    <text class="tagline" x="354" y="256" font-size="30" font-weight="500" letter-spacing="-0.2" fill="#cfc9e6">A beautiful, free AI assistant for your terminal.</text>

    <!-- feature pills -->
    <g class="pills" font-size="19" font-weight="600" letter-spacing="0">
      <g transform="translate(354 298)">
        <rect width="188" height="40" rx="20" fill="#bd93f9" fill-opacity="0.12" stroke="#bd93f9" stroke-opacity="0.35" stroke-width="1.2"/>
        <text x="24" y="26" fill="#bd93f9" font-family="'JetBrains Mono', 'Cascadia Code', monospace">100% free models</text>
      </g>
      <g transform="translate(558 298)">
        <rect width="152" height="40" rx="20" fill="#50fa7b" fill-opacity="0.1" stroke="#50fa7b" stroke-opacity="0.35" stroke-width="1.2"/>
        <text x="22" y="26" fill="#50fa7b" font-family="'JetBrains Mono', 'Cascadia Code', monospace">no API key</text>
      </g>
      <g transform="translate(728 298)">
        <rect width="204" height="40" rx="20" fill="#8be9fd" fill-opacity="0.1" stroke="#8be9fd" stroke-opacity="0.35" stroke-width="1.2"/>
        <text x="22" y="26" fill="#8be9fd" font-family="'JetBrains Mono', 'Cascadia Code', monospace">macOS / Linux / Win</text>
      </g>
    </g>
  </g>
</svg>
