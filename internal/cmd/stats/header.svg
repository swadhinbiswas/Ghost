<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 140" width="100%" height="100%" shape-rendering="crispEdges">

  <!-- Background -->
  <rect width="1200" height="140" fill="#1a1a22"/>

  <!-- Pattern defs -->
  <defs>
    <!-- Diagonal glitch lines -->
    <pattern id="diagonal" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 8 L8 0" stroke="#bb9af7" stroke-width="2"/>
    </pattern>

    <!-- Dark grid -->
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#111118"/>
      <path d="M20 0H0V20" stroke="#2a2a3a" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Top grid strip -->
  <rect x="0" y="0" width="1200" height="40" fill="url(#grid)" />

  <!-- Main glitch bar -->
  <rect x="200" y="20" width="950" height="60" fill="#2a2a3a"/>
  <rect x="200" y="20" width="950" height="60" fill="url(#diagonal)" opacity="0.7"/>

  <!-- 👻 Pixel Ghost Logo -->
  <g transform="translate(60,30) scale(0.8)">

    <!-- Body -->
    <path fill="#bb9af7" d="
      M60 20 H140
      V40 H160
      V60 H180
      V120 H160
      V140 H140
      V160 H120
      V180 H100
      V160 H80
      V180 H60
      V160 H40
      V140 H20
      V120 H0
      V60 H20
      V40 H40
      V20 H60
      Z
    "/>

    <!-- Eyes -->
    <rect x="72" y="78" width="12" height="22" fill="#0b0b10"/>
    <rect x="116" y="78" width="12" height="22" fill="#0b0b10"/>

    <!-- Mouth -->
    <rect x="90" y="112" width="20" height="10" fill="#0b0b10"/>

    <!-- Blush -->
    <rect x="58" y="104" width="12" height="10" fill="#ff4d88"/>
    <rect x="130" y="104" width="12" height="10" fill="#ff4d88"/>

  </g>

  <!-- 👻 GHOST text (pixel feel) -->
  <text x="220" y="95"
        font-family="monospace"
        font-size="64"
        font-weight="bold"
        fill="#bb9af7"
        letter-spacing="6">
    GHOST
  </text>

  <!-- Accent bottom line -->
  <rect x="0" y="135" width="1200" height="5" fill="#bb9af7"/>

</svg>