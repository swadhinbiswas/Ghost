<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none" role="img" aria-label="Ghost — a beautiful, free AI assistant for your terminal">
  <title>Ghost CLI</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15131f"/>
      <stop offset="0.55" stop-color="#0e0d15"/>
      <stop offset="1" stop-color="#0a0910"/>
    </linearGradient>
    <radialGradient id="glowP" cx="0.2" cy="0.1" r="0.8">
      <stop offset="0" stop-color="#bd93f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowK" cx="0.9" cy="0.85" r="0.7">
      <stop offset="0" stop-color="#ff79c6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff79c6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#e9d9ff"/>
      <stop offset="0.4" stop-color="#bd93f9"/>
      <stop offset="0.75" stop-color="#ff79c6"/>
      <stop offset="1" stop-color="#ffb86c"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#efeaff"/>
      <stop offset="1" stop-color="#c9aefc"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bd93f9" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ff79c6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      @keyframes float { 0%,100%{ transform: translateY(0) rotate(-1.5deg);} 50%{ transform: translateY(-14px) rotate(1.5deg);} }
      @keyframes pulse { 0%,100%{ opacity:.55; transform: scale(1);} 50%{ opacity:1; transform: scale(1.08);} }
      @keyframes blink { 0%,92%,100%{ transform: scaleY(1);} 96%{ transform: scaleY(.1);} }
      @keyframes tw { 0%,100%{ opacity:.2;} 50%{ opacity:1;} }
      @keyframes dash { to { stroke-dashoffset: 0; } }
      .ghost { transform-box: fill-box; transform-origin: center; animation: float 5s ease-in-out infinite; }
      .aura  { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite; }
      .eyes  { transform-box: fill-box; transform-origin: center; animation: blink 6s infinite; }
      .s1 { animation: tw 3s ease-in-out infinite; }
      .s2 { animation: tw 2.4s ease-in-out infinite .6s; }
      .s3 { animation: tw 3.4s ease-in-out infinite 1.1s; }
      .s4 { animation: tw 2.8s ease-in-out infinite .3s; }
      .underline { stroke-dasharray: 520; stroke-dashoffset: 520; animation: dash 1.6s ease-out .3s forwards; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="380" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glowP)"/>
  <rect width="1200" height="380" rx="28" fill="url(#glowK)"/>
  <rect x="1" y="1" width="1198" height="378" rx="27" fill="none" stroke="#bd93f9" stroke-opacity="0.18"/>

  <!-- twinkle stars -->
  <g fill="#f8f8f2">
    <circle class="s1" cx="560" cy="70" r="2"/>
    <circle class="s2" cx="980" cy="60" r="1.6"/>
    <circle class="s3" cx="1100" cy="150" r="2.2"/>
    <circle class="s4" cx="700" cy="300" r="1.6"/>
    <circle class="s2" cx="1040" cy="280" r="1.8"/>
    <circle class="s1" cx="470" cy="250" r="1.5"/>
  </g>

  <!-- ghost mascot -->
  <g transform="translate(150 190)">
    <ellipse class="aura" cx="0" cy="0" rx="135" ry="135" fill="url(#aura)" filter="url(#soft)"/>
    <g class="ghost">
      <!-- little arms -->
      <ellipse cx="-66" cy="22" rx="12" ry="18" transform="rotate(20 -66 22)" fill="url(#skin)"/>
      <ellipse cx="66" cy="22" rx="12" ry="18" transform="rotate(-20 66 22)" fill="url(#skin)"/>
      <!-- chubby body with cute waves -->
      <path d="M-70 4 Q-70 -82 0 -82 Q70 -82 70 4 L70 74
               Q70 90 57 90 Q46 90 42 79 Q38 90 27 90 Q16 90 12 79
               Q8 90 0 90 Q-8 90 -12 79 Q-16 90 -27 90 Q-38 90 -42 79
               Q-46 90 -57 90 Q-70 90 -70 74 Z" fill="url(#skin)"/>
      <!-- rosy cheeks -->
      <ellipse cx="-34" cy="18" rx="15" ry="9" fill="#ff8ed0" fill-opacity="0.85"/>
      <ellipse cx="34" cy="18" rx="15" ry="9" fill="#ff8ed0" fill-opacity="0.85"/>
      <!-- big sparkly eyes -->
      <g class="eyes">
        <ellipse cx="-26" cy="-8" rx="14" ry="19" fill="#16121f"/>
        <ellipse cx="26" cy="-8" rx="14" ry="19" fill="#16121f"/>
        <circle cx="-21" cy="-15" r="5.5" fill="#fff"/>
        <circle cx="31" cy="-15" r="5.5" fill="#fff"/>
        <circle cx="-30" cy="-2" r="2.6" fill="#fff" fill-opacity="0.85"/>
        <circle cx="22" cy="-2" r="2.6" fill="#fff" fill-opacity="0.85"/>
      </g>
      <!-- tiny happy mouth -->
      <path d="M-8 20 Q0 30 8 20 Q0 26 -8 20 Z" fill="#16121f"/>
    </g>
  </g>

  <!-- wordmark + tagline -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="340" y="178" font-size="118" font-weight="800" letter-spacing="-3" fill="url(#word)">Ghost</text>
    <path class="underline" d="M344 206 H862" stroke="url(#word)" stroke-width="5" stroke-linecap="round"/>
    <text x="346" y="252" font-size="29" font-weight="600" fill="#cfc9e6">A beautiful, free AI assistant for your terminal.</text>

    <!-- feature pills -->
    <g font-size="20" font-weight="600" font-family="'JetBrains Mono','Courier New',monospace">
      <g transform="translate(346 290)">
        <rect width="186" height="40" rx="20" fill="#bd93f9" fill-opacity="0.12" stroke="#bd93f9" stroke-opacity="0.4"/>
        <text x="22" y="26" fill="#bd93f9">100% free models</text>
      </g>
      <g transform="translate(548 290)">
        <rect width="150" height="40" rx="20" fill="#50fa7b" fill-opacity="0.1" stroke="#50fa7b" stroke-opacity="0.4"/>
        <text x="20" y="26" fill="#50fa7b">no API key</text>
      </g>
      <g transform="translate(714 290)">
        <rect width="196" height="40" rx="20" fill="#8be9fd" fill-opacity="0.1" stroke="#8be9fd" stroke-opacity="0.4"/>
        <text x="20" y="26" fill="#8be9fd">macOS / Linux / Win</text>
      </g>
    </g>
  </g>
</svg>
