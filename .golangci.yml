version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Start from the default set (errcheck, govet, ineffassign, staticcheck,
  # unused) and add a few high-signal, low-noise linters.
  enable:
    - misspell
    - bodyclose
    - unconvert
    - whitespace

  settings:
    misspell:
      locale: US

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      # Generated by sqlc — not our code to lint.
      - internal/db
      - third_party$
      - builtin$
      - examples$

formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - internal/db
